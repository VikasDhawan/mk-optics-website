# Keeps the Supabase free-plan project awake by making one small database
# request every 3 days. Runs on GitHub Actions, free of charge.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL       e.g. https://abcdefghijk.supabase.co
#   SUPABASE_ANON_KEY  the "anon" / publishable key from Supabase Settings -> API
#
# Never put the service_role key in this file or in secrets used here.

name: Keep Supabase alive

on:
  schedule:
    # Every 3 days at 03:00 UTC (08:30 India time). Supabase pauses after 7 quiet days.
    - cron: "0 3 */3 * *"
  workflow_dispatch:   # lets you run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send a small request to the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY secret."
            exit 1
          fi
          # --fail makes the job turn red if Supabase does not answer successfully.
          HTTP_CODE=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --fail-with-body \
            "$SUPABASE_URL/rest/v1/appointment_requests?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY") || true
          echo "Supabase responded with HTTP $HTTP_CODE"
          case "$HTTP_CODE" in
            2*) echo "Project is awake." ;;
            *)  echo "Unexpected response - check the project in the Supabase dashboard."; exit 1 ;;
          esac
