<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book an Eye Test | MK Optics</title>

<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    :root {
        --navy: #0d2a66;
        --navy-dark: #081b45;
        --green: #6fd66f;
        --green-dark: #1c7a3e;
        --ink: #101a33;
        --grey: #5a6478;
        --line: #dde3ef;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(160deg, var(--navy) 0%, var(--navy-dark) 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        color: var(--ink);
    }

    .card {
        background: #fff;
        border-radius: 14px;
        max-width: 440px;
        width: 100%;
        padding: 36px 30px;
        text-align: center;
    }

    .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-family: Georgia, serif;
        font-weight: 700;
        font-size: 20px;
        color: var(--navy);
        margin-bottom: 22px;
    }

    h1 { font-family: Georgia, serif; font-size: 24px; color: var(--navy); margin-bottom: 8px; }
    p.sub { color: var(--grey); font-size: 14px; margin-bottom: 26px; }

    .field { margin-bottom: 16px; text-align: left; }

    label {
        display: block;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: var(--grey);
        font-weight: 700;
        margin-bottom: 6px;
    }

    input[type="text"], input[type="tel"], input[type="date"], select, textarea {
        width: 100%;
        padding: 13px 14px;
        border: 1.5px solid var(--line);
        border-radius: 8px;
        font-size: 15px;
        font-family: inherit;
        background: #fff;
    }

    .phone-row { display: flex; gap: 8px; }
    .phone-row select { flex: 0 0 108px; width: auto; padding-left: 8px; padding-right: 4px; }
    .phone-row input { flex: 1; min-width: 0; }

    .time-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .time-row select { flex: 1 1 80px; width: auto; min-width: 70px; }
    .ampm-toggle { display: flex; gap: 6px; flex: 1 1 140px; }
    .ampm-btn {
        flex: 1;
        padding: 13px 8px;
        border: 1.5px solid var(--line);
        border-radius: 8px;
        background: #fff;
        font-size: 14px;
        font-weight: 700;
        color: var(--grey);
        cursor: pointer;
        font-family: inherit;
    }
    .ampm-btn.active {
        background: var(--green);
        border-color: var(--green-dark);
        color: var(--navy-dark);
    }

    textarea { resize: vertical; min-height: 70px; }
    input:focus, textarea:focus { outline: none; border-color: var(--green-dark); }

    .btn {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 8px;
        background: var(--green);
        color: var(--navy-dark);
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        margin-top: 6px;
    }

    .btn:hover { background: #5cc95c; }

    .error-msg { color: #b02a2a; font-size: 13px; margin-top: 12px; }
    .success-icon { font-size: 44px; margin-bottom: 14px; }
</style>
</head>
<body>

<div class="card">

    <div id="form-view">
        <div class="brand">
            <svg width="26" height="13" viewBox="0 0 48 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <circle cx="12" cy="12" r="10" stroke="#1c7a3e" stroke-width="3"/>
                <circle cx="36" cy="12" r="10" stroke="#1c7a3e" stroke-width="3"/>
            </svg>
            MK OPTICS
        </div>
        <h1>Book an Eye Test</h1>
        <p class="sub">Tell us a bit about you and your preferred date — we'll confirm by WhatsApp or phone.</p>

        <div class="field">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Your full name">
        </div>
        <div class="field">
            <label for="phone">Mobile Number</label>
            <div class="phone-row">
                <select id="phone-code" aria-label="Country code">
                    <option value="91" selected>🇮🇳 +91</option>
                    <option value="971">🇦🇪 +971</option>
                    <option value="966">🇸🇦 +966</option>
                    <option value="965">🇰🇼 +965</option>
                    <option value="974">🇶🇦 +974</option>
                    <option value="973">🇧🇭 +973</option>
                    <option value="968">🇴🇲 +968</option>
                    <option value="1">🇺🇸 +1</option>
                    <option value="44">🇬🇧 +44</option>
                    <option value="65">🇸🇬 +65</option>
                    <option value="60">🇲🇾 +60</option>
                    <option value="61">🇦🇺 +61</option>
                </select>
                <input type="tel" id="phone" placeholder="98450 12345">
            </div>
        </div>
        <div class="field">
            <label for="date">Preferred Date</label>
            <input type="date" id="date">
        </div>
        <div class="field">
            <label>Preferred Time (optional)</label>
            <div class="time-row">
                <select id="time-hour" aria-label="Hour">
                    <option value="">Hour</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                    <option value="11">11</option>
                    <option value="12">12</option>
                </select>
                <select id="time-minute" aria-label="Minute">
                    <option value="00">:00</option>
                    <option value="15">:15</option>
                    <option value="30">:30</option>
                    <option value="45">:45</option>
                </select>
                <div class="ampm-toggle">
                    <button type="button" class="ampm-btn" id="ampm-am" data-value="AM">AM</button>
                    <button type="button" class="ampm-btn" id="ampm-pm" data-value="PM">PM</button>
                </div>
            </div>
        </div>
        <div class="field">
            <label for="notes">Anything else? (optional)</label>
            <textarea id="notes" placeholder="e.g. Preferred time of day, specific concern"></textarea>
        </div>

        <button class="btn" id="book-btn">Request Appointment</button>
        <p id="error-msg" class="error-msg"></p>
    </div>

    <div id="success-view" hidden>
        <div class="success-icon">📅</div>
        <h1>Request Sent!</h1>
        <p class="sub">We've got your details and will confirm your appointment shortly.</p>
    </div>

</div>

<script src="supabase-config.js" onerror="window.__SUPABASE_CONFIG_MISSING__ = true"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
    const cfg = window.SUPABASE_CONFIG;
    let supabase = null;
    if (cfg && cfg.url && cfg.url.indexOf('YOUR-PROJECT-REF') === -1) {
        supabase = window.supabase.createClient(cfg.url, cfg.anonKey);
    }

    const el = (id) => document.getElementById(id);
    const errorEl = el('error-msg');

    // Tap-only AM/PM toggle — no ambiguity about whether "4" means 4am or
    // 4pm, and nothing to scroll through like a native 24-hour time input.
    let selectedAmPm = null;
    el('ampm-am').addEventListener('click', () => setAmPm('AM'));
    el('ampm-pm').addEventListener('click', () => setAmPm('PM'));
    function setAmPm(value) {
        selectedAmPm = value;
        el('ampm-am').classList.toggle('active', value === 'AM');
        el('ampm-pm').classList.toggle('active', value === 'PM');
    }

    // Converts the Hour/Minute/AM-PM picker into a 24-hour "HH:MM" string
    // for the database. Returns undefined (valid, just "no time chosen")
    // when the hour is blank, or null (invalid) when an hour was picked
    // but AM/PM wasn't.
    function getPreferredTime() {
        const hour12 = el('time-hour').value;
        if (!hour12) return undefined;
        if (!selectedAmPm) return null;
        let h = parseInt(hour12, 10) % 12;
        if (selectedAmPm === 'PM') h += 12;
        const m = el('time-minute').value || '00';
        return String(h).padStart(2, '0') + ':' + m;
    }

    el('book-btn').addEventListener('click', async () => {
        const name = el('name').value.trim();
        const phoneDigits = el('phone').value.replace(/\D/g, '');
        const phone = phoneDigits ? '+' + el('phone-code').value + phoneDigits : '';
        const date = el('date').value;
        const preferredTime = getPreferredTime();
        errorEl.textContent = '';

        if (!name || !phone) {
            errorEl.textContent = 'Please enter your name and mobile number.';
            return;
        }
        if (preferredTime === null) {
            errorEl.textContent = 'Please choose AM or PM for your preferred time.';
            return;
        }
        if (!supabase) {
            errorEl.textContent = 'Booking is temporarily unavailable — please call or WhatsApp us instead.';
            return;
        }

        const { error } = await supabase.from('appointment_requests').insert({
            name,
            phone,
            preferred_date: date || null,
            preferred_time: preferredTime || null,
            notes: el('notes').value.trim() || null
        });

        if (error) {
            errorEl.textContent = 'Something went wrong — please call or WhatsApp us instead.';
            return;
        }

        el('form-view').hidden = true;
        el('success-view').hidden = false;
    });
})();
</script>

</body>
</html>
